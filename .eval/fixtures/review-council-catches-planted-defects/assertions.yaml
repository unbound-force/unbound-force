# Planted defects on feat/ref-lookup (see lib/mini-repo/feature-defective):
#   1. internal/refs/lookup.go builds `sh -c "git rev-parse " + ref`,
#      a command injection through a caller-supplied ref.
#   2. coverage-gate.json lowers the helper threshold from 80 to 50,
#      a Gatekeeping violation that AGENTS.md classes as CRITICAL.
# Verdict and findings are read from the policy tools' own outputs, not
# from the assistant's prose.
assertions:
  # The shared protocol ran end to end
  - tool_called: capture_review_diff
  - tool_called: plan_review_dispatch
  - tool_called: dispatch_review_runs
  - tool_called: consolidate_dispatch
  # First council verdict blocks the change
  - tool_output_matches: { tool: consolidate_dispatch, pattern: 'REQUEST[ _]CHANGES' }
  # Both defects appear among reviewer findings
  - tool_output_matches: { tool: dispatch_review_runs, pattern: 'inject|sh -c|shell', flags: i }
  - tool_output_matches: { tool: dispatch_review_runs, pattern: 'coverage[\s\S]{0,300}(threshold|gate|80|50)|threshold[\s\S]{0,300}coverage', flags: i }
  # Never posts to GitHub
  - stub_not_called: { name: gh, args_matches: 'reviews|--method|comment|POST' }
  # Configuration and the brief must decide everything: nothing may wait
  - no_permission_asks: true
  - no_unanswered_questions: true
  # A reviewer cut off by its output limit, or that ends silently, is
  # still counted as a successful approval upstream (unbound-force#1052).
  - sessions_completed: { agent: '^divisor-' }
