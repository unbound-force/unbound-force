#
# CI Checks
# =========
# Runs MegaLinter (Go, Actions, Bash, Gitleaks) and
# validates PR titles against conventional commit format.
# Consumes the reusable CI workflow from org-infra.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: none
  pull-requests: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the gated jobs must run. Pull requests whose files
  # are all Dewey learnings (.uf/dewey/learnings/*.md), or gh-hud toolkit
  # rollouts (jflowers, chore/toolkit-*, all under .opencode/), skip
  # them; pushes and everything else run them. Fails closed.
  changes:
    uses: jflowers/ship/.github/workflows/pr-scope.yml@3b0ce8bf47183be402df9eaec16644c213eee5f7 # v0.12.0
    permissions:
      contents: read

  call_reusable_ci:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Standardized CI
    uses: complytime/org-infra/.github/workflows/reusable_ci.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    permissions:
      contents: read
      issues: read
      pull-requests: read

  ci-ok:
    name: Standardized CI OK
    if: always()
    needs: [changes, call_reusable_ci]
    runs-on: ubuntu-latest
    steps:
      - name: Verify detection passed and the gated jobs it chose ran
        env:
          SCOPE: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CALL_REUSABLE_CI: ${{ needs.call_reusable_ci.result }}
        run: |
          if [ "$SCOPE" != success ]; then
            echo "::error::change detection did not succeed (result: $SCOPE)"
            exit 1
          fi
          case "$CODE" in
            true) want=success ;;
            false) want=skipped ;;
            *) echo "::error::unexpected scope code '$CODE'"; exit 1 ;;
          esac
          if [ "$CALL_REUSABLE_CI" != "$want" ]; then
            echo "::error::call_reusable_ci is $CALL_REUSABLE_CI, expected $want (code=$CODE)"
            exit 1
          fi
          echo "Standardized CI OK passed (code=$CODE)."
