#
# CI Checks
# =========
# Runs MegaLinter (Go, Actions, Bash, Gitleaks) and
# validates PR titles against conventional commit format.
# Consumes the reusable CI workflow from org-infra.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: none
  pull-requests: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Learnings-Only Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout Code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Test Detector
        if: github.event_name == 'pull_request'
        run: bash scripts/detect-learnings-only_test.sh

      - name: Detect Changed Files
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code='true'
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            code="$(bash scripts/detect-learnings-only.sh)"
          fi
          case "$code" in
            true|false) ;;
            *) code='true' ;;
          esac
          cat >>"$GITHUB_OUTPUT" <<CHANGES_EOF
          code=$code
          CHANGES_EOF

  call_reusable_ci:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Standardized CI
    uses: complytime/org-infra/.github/workflows/reusable_ci.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    permissions:
      contents: read
      issues: read
      pull-requests: read

  ci-ok:
    name: Standardized CI OK
    if: always()
    needs: [changes, call_reusable_ci]
    runs-on: ubuntu-latest
    steps:
      - name: Verify detection passed and gated jobs passed or were skipped
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection did not succeed (result: ${{ needs.changes.result }})"
            exit 1
          fi
          for result in "${{ needs.call_reusable_ci.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required job did not succeed (result: $result)"
              exit 1
            fi
          done
