# SPDX-License-Identifier: Apache-2.0
#
# CI Checks
# =========
# Runs MegaLinter (Go, Actions, Bash, Gitleaks) and
# validates PR titles against conventional commit format.
# Consumes the reusable CI workflow from org-infra.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: none
  pull-requests: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Learnings-Only Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Changed Files
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code='true'
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            diffout="$(mktemp)"
            if git diff -z --no-renames --raw "$BASE_SHA...$HEAD_SHA" >"$diffout" && [ -s "$diffout" ]; then
              code='false'
              while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
                newmode="${meta#* }"
                newmode="${newmode%% *}"
                status="${meta##* }"
                printf 'changed: %s\n' "$path"
                case "$path" in
                  .uf/dewey/learnings/*.md) ;;
                  *) code='true' ;;
                esac
                case "$newmode" in
                  100644|100755) ;;
                  *) code='true' ;;
                esac
                case "$status" in
                  A|D|M|T) ;;
                  R*|C*)
                    code='true'
                    if IFS= read -r -d '' path; then
                      printf 'changed: %s\n' "$path"
                    fi
                    ;;
                  *) code='true' ;;
                esac
              done <"$diffout"
            fi
            rm -f "$diffout"
          fi
          cat >>"$GITHUB_OUTPUT" <<CHANGES_EOF
          code=$code
          CHANGES_EOF

  call_reusable_ci:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Standardized CI
    uses: complytime/org-infra/.github/workflows/reusable_ci.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    permissions:
      contents: read
      issues: read
      pull-requests: read

  ci-ok:
    name: Standardized CI OK
    if: always()
    needs: [changes, call_reusable_ci]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed or were skipped
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.call_reusable_ci.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required job did not succeed (result: $result)"
              exit 1
            fi
          done
