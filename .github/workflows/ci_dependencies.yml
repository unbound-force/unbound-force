#
# Dependencies
# ============
# Reviews the dependency changes of every pull request to
# main. Dependabot's own pull requests merge through
# dependabot-automerge.yml (jflowers/ship).

name: Dependencies

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: none
  pull-requests: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chore PRs (Dewey learnings, gh-hud toolkit rollouts) skip these
  # jobs; see ci_local.yml. Pushes run them.
  scope:
    uses: jflowers/ship/.github/workflows/pr-scope.yml@3b0ce8bf47183be402df9eaec16644c213eee5f7 # main, after v0.11.0
    permissions:
      contents: read

  call_deps_reviewer:
    name: General
    needs: scope
    if: needs.scope.outputs.code == 'true'
    uses: complytime/org-infra/.github/workflows/reusable_deps_reviewer.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
