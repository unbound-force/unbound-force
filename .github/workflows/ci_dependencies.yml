# Dependencies
# ============
# Reviews the dependency changes of every pull request to
# main. Dependabot's own pull requests merge through
# dependabot-automerge.yml (jflowers/ship).

name: Dependencies

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: none
  pull-requests: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call_deps_reviewer:
    name: General
    uses: complytime/org-infra/.github/workflows/reusable_deps_reviewer.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
