# SPDX-License-Identifier: Apache-2.0
#
# Local CI
# ========
# Project-specific checks that cannot be delegated to
# org-infra reusable workflows: build, test with race
# detection, coverage ratchet enforcement, and a push-to-main
# gaze AI quality report.

name: Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Learnings-Only Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Changed Files
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code='true'
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            diffout="$(mktemp)"
            if git diff -z --no-renames --raw "$BASE_SHA...$HEAD_SHA" >"$diffout" && [ -s "$diffout" ]; then
              code='false'
              while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
                newmode="${meta#* }"
                newmode="${newmode%% *}"
                status="${meta##* }"
                printf 'changed: %s\n' "$path"
                case "$path" in
                  .uf/dewey/learnings/*.md) ;;
                  *) code='true' ;;
                esac
                case "$newmode" in
                  100644|100755) ;;
                  *) code='true' ;;
                esac
                case "$status" in
                  A|D|M|T) ;;
                  R*|C*)
                    code='true'
                    if IFS= read -r -d '' path; then
                      printf 'changed: %s\n' "$path"
                    fi
                    ;;
                  *) code='true' ;;
                esac
              done <"$diffout"
            fi
            rm -f "$diffout"
          fi
          cat >>"$GITHUB_OUTPUT" <<CHANGES_EOF
          code=$code
          CHANGES_EOF

  build-and-test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Enforce Coverage Ratchets
        run: |
          # Calculate global coverage
          GLOBAL_COV=$(go tool cover -func=coverage.out | grep total: | awk '{print substr($3, 1, length($3)-1)}')
          echo "Global coverage: $GLOBAL_COV%"
          if (( $(echo "$GLOBAL_COV < 80.0" | bc -l) )); then
            echo "Error: Global coverage $GLOBAL_COV% is below the 80% threshold."
            exit 1
          fi


      - name: Enforce Scope Coverage Gate
        run: |
          BASE="${GITHUB_BASE_SHA:-origin/main}"
          go run ./cmd/coverage-gate -manifest coverage-gate.json -profile coverage.out -base "${BASE}"

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-out
          path: coverage.out

  plugin-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Run plugin tests
        run: make plugin-test

  council-review-action-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Council Review Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run pipeline tests
        run: bash council-review-action/test/test-pipeline.sh

  gaze-ai-report:
    name: Gaze AI Report
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: unbound-force/gaze/.github/workflows/reusable_gaze_ai_report.yml@35cdbaab059b93a9c6a3c6ea24b334b1f958a61c  # v2.5.0
    with:
      coverage-artifact: coverage-out
      max-crapload: 30
      max-gaze-crapload: 12
      min-contract-coverage: 55
    secrets:
      opencode-config: ${{ secrets.OPENCODE_CONFIG_CONTENT }}

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, build-and-test, plugin-tests, council-review-action-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed or were skipped
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.build-and-test.result }}" "${{ needs.plugin-tests.result }}" "${{ needs.council-review-action-tests.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required job did not succeed (result: $result)"
              exit 1
            fi
          done
