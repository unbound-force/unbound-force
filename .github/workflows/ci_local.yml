#
# Local CI
# ========
# Project-specific checks that cannot be delegated to
# org-infra reusable workflows: build, test with race
# detection, coverage ratchet enforcement, and a push-to-main
# gaze AI quality report.

name: Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Enforce Coverage Ratchets
        run: |
          # Calculate global coverage
          GLOBAL_COV=$(go tool cover -func=coverage.out | grep total: | awk '{print substr($3, 1, length($3)-1)}')
          echo "Global coverage: $GLOBAL_COV%"
          if (( $(echo "$GLOBAL_COV < 80.0" | bc -l) )); then
            echo "Error: Global coverage $GLOBAL_COV% is below the 80% threshold."
            exit 1
          fi


      - name: Enforce Scope Coverage Gate
        run: |
          BASE="${GITHUB_BASE_SHA:-origin/main}"
          go run ./cmd/coverage-gate -manifest coverage-gate.json -profile coverage.out -base "${BASE}"

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-out
          path: coverage.out

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Run plugin tests
        run: make plugin-test

  council-review-action-tests:
    name: Council Review Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run pipeline tests
        run: bash council-review-action/test/test-pipeline.sh

  gaze-ai-report:
    name: Gaze AI Report
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: unbound-force/gaze/.github/workflows/reusable_gaze_ai_report.yml@8031d41943b06407cb92322791b177b41b7b2775  # v2.3.0
    with:
      coverage-artifact: coverage-out
      max-crapload: 30
      max-gaze-crapload: 12
      min-contract-coverage: 55
    secrets:
      opencode-config: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
