# SPDX-License-Identifier: Apache-2.0
#
# Scheduled Jobs
# ==============
# Runs daily OSV-Scanner and OpenSSF Scorecards against
# the default branch to detect newly-disclosed CVEs in
# already-merged dependencies, plus the plugin suite's
# transitive dependencies through a throwaway lock that
# is never tracked or shipped.

name: Scheduled Jobs

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  actions: none
  id-token: none
  security-events: none

jobs:
  call_reusable_scheduled:
    name: OSV-Scanner and Scorecards
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: complytime/org-infra/.github/workflows/reusable_scheduled.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0

  osv_plugin_transitive:
    name: OSV-Scanner (plugin transitive)
    # The reusable scheduled OSV pass scans the manifests it finds on
    # the default branch; since stop-shipping-plugin-lock removed the
    # tracked plugin lock, direct pins were all it could see. This job
    # restores the daily transitive coverage the tracked lock used to
    # provide, mirroring the throwaway-lock scan ci_security.yml runs
    # on push and pull request.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Generate throwaway lock
        # npm pin is the twin of Makefile PLUGIN_TEST_NPM; keep in sync.
        run: cd .opencode && npx -y npm@11.6.2 install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Scan plugin transitive dependencies
        # setup-go v7 pins GOTOOLCHAIN=local (go 1.25.0 from go.mod), but
        # osv-scanner v2.7.0 requires go >= 1.27.0. The explicit floor pin
        # encodes the pinned scanner's declared toolchain requirement under
        # repo control; bump it in lockstep with the osv-scanner pin below
        # (paired-pin convention, like the npm pin above) and on Go
        # toolchain patch security releases.
        run: |
          export GOTOOLCHAIN=go1.27.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile=.opencode/package-lock.json
