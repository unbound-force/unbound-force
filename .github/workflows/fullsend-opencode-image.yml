# SPDX-License-Identifier: Apache-2.0
#
# FullSend OpenCode sandbox image
# ==============================
# Builds the organization-owned OpenCode sandbox image for both supported
# Linux architectures. Pull requests validate the image without publishing;
# non-PR events publish the tags documented in FullSend's image conventions.
#
# The published manifest digest is exposed as a job output so a subsequent
# signing and SBOM-attestation job can operate on the immutable image rather
# than on a mutable tag.

name: FullSend OpenCode Image

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+*"
    paths:
      - "images/fullsend-opencode/**"
      - ".github/workflows/fullsend-opencode-image.yml"
  pull_request:
    paths:
      - "images/fullsend-opencode/**"
      - ".github/workflows/fullsend-opencode-image.yml"
  workflow_dispatch:

# GitHub ignores path filters for tag pushes. This is intentional: release
# tags should publish the image alongside the corresponding CLI release.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and Publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.image-ref.outputs.value }}
    env:
      IMAGE_NAME: ghcr.io/unbound-force/fullsend-opencode
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Release Tag Matches uf Version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          uf_version=$(sed -n 's/^ARG UF_VERSION=//p' images/fullsend-opencode/Containerfile)
          test -n "$uf_version"
          expected_tag="v${uf_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match UF_VERSION=${uf_version}"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and Publish Multi-Arch Image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/fullsend-opencode
          file: images/fullsend-opencode/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fullsend-opencode
          cache-to: type=gha,mode=max,scope=fullsend-opencode

      - name: Compute Published Image Reference
        id: image-ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -n "$DIGEST" ]; then
            echo "value=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

  pull-request-validation:
    name: PR Validation (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Pinned Versions
        id: versions
        run: |
          set -eu
          opencode_version=$(sed -n 's/^ARG OPENCODE_VERSION=//p' images/fullsend-opencode/Containerfile)
          uf_version=$(sed -n 's/^ARG UF_VERSION=//p' images/fullsend-opencode/Containerfile)
          test -n "$opencode_version"
          test -n "$uf_version"
          echo "opencode=$opencode_version" >> "$GITHUB_OUTPUT"
          echo "uf=$uf_version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Validation Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/fullsend-opencode
          file: images/fullsend-opencode/Containerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fullsend-opencode:pr-${{ matrix.arch }}
          cache-from: type=gha,scope=fullsend-opencode

      - name: Validate Image Contents
        env:
          EXPECTED_OPENCODE: ${{ steps.versions.outputs.opencode }}
          EXPECTED_UF: ${{ steps.versions.outputs.uf }}
        run: |
          docker run --rm --entrypoint '' \
            -e EXPECTED_OPENCODE \
            -e EXPECTED_UF \
            "fullsend-opencode:pr-${{ matrix.arch }}" \
            sh -ceu '
              test "$(id -u)" = "998"
              test "$(opencode --version)" = "$EXPECTED_OPENCODE"
              uf --version | grep -F "unbound-force version $EXPECTED_UF "
              ! command -v dewey
              ! command -v ollama
            '

  published-validation:
    name: Published Validation (${{ matrix.arch }})
    needs: build-and-publish
    if: >-
      github.event_name != 'pull_request'
      && needs.build-and-publish.result == 'success'
      && needs.build-and-publish.outputs.image-ref != ''
    outputs:
      image-ref: ${{ needs.build-and-publish.outputs.image-ref }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Pinned Versions
        id: versions
        run: |
          set -eu
          opencode_version=$(sed -n 's/^ARG OPENCODE_VERSION=//p' images/fullsend-opencode/Containerfile)
          uf_version=$(sed -n 's/^ARG UF_VERSION=//p' images/fullsend-opencode/Containerfile)
          test -n "$opencode_version"
          test -n "$uf_version"
          echo "opencode=$opencode_version" >> "$GITHUB_OUTPUT"
          echo "uf=$uf_version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Pull Published Image
        env:
          IMAGE: ${{ needs.build-and-publish.outputs.image-ref }}
        run: docker pull --platform "linux/${{ matrix.arch }}" "$IMAGE"

      - name: Validate Image Contents
        env:
          EXPECTED_OPENCODE: ${{ steps.versions.outputs.opencode }}
          EXPECTED_UF: ${{ steps.versions.outputs.uf }}
          IMAGE: ${{ needs.build-and-publish.outputs.image-ref }}
        run: |
          docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint '' \
            -e EXPECTED_OPENCODE \
            -e EXPECTED_UF \
            "$IMAGE" \
            sh -ceu '
              test "$(id -u)" = "998"
              test "$(opencode --version)" = "$EXPECTED_OPENCODE"
              uf --version | grep -F "unbound-force version $EXPECTED_UF "
              ! command -v dewey
              ! command -v ollama
            '

  image-scan:
    name: Scan Published Image
    needs: published-validation
    if: >-
      github.event_name != 'pull_request'
      && needs.published-validation.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      packages: read
      security-events: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Image With Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          scanners: vuln
          image-ref: ${{ needs.published-validation.outputs.image-ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Upload Trivy Results
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-image.sarif

  supply-chain:
    name: Sign and Attest
    needs:
      - build-and-publish
      - published-validation
      - image-scan
    if: >-
      github.event_name != 'pull_request'
      && needs.build-and-publish.outputs.image-ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/unbound-force/fullsend-opencode
      IMAGE: ${{ needs.build-and-publish.outputs.image-ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      CERTIFICATE_IDENTITY_REGEX: https://github.com/${{ github.repository }}/.github/workflows/fullsend-opencode-image.yml@.*
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SLSA Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-publish.outputs.image-digest }}
          push-to-registry: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-publish.outputs.image-digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Image Digest
        run: cosign sign --yes "$IMAGE"

      - name: Verify Image Signature
        run: |
          cosign verify \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEX" \
            --certificate-oidc-issuer="$OIDC_ISSUER" \
            "$IMAGE" > /dev/null

      - name: Verify SLSA Provenance
        run: |
          cosign verify-attestation \
            --type https://slsa.dev/provenance/v1 \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEX" \
            --certificate-oidc-issuer="$OIDC_ISSUER" \
            "$IMAGE" > /dev/null

      - name: Verify SPDX SBOM
        run: |
          cosign verify-attestation \
            --type https://spdx.dev/Document \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEX" \
            --certificate-oidc-issuer="$OIDC_ISSUER" \
            "$IMAGE" > /dev/null
