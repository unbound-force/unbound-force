# SPDX-License-Identifier: Apache-2.0
#
# Release
# =======
# One-click release pipeline triggered via workflow_dispatch, through
# jflowers/ship's shared go-release.yml (the same pipeline replicator, dewey
# and gaze use):
#
# - org-infra's preflight validates semver format, tag uniqueness (with
#   re-run resilience), semver ordering, CI check status and unreleased
#   commits, then creates an annotated tag;
# - GoReleaser (org-infra) builds the archives, checksums, cosign
#   signatures and SBOMs, and the cask and formula as release assets;
# - the darwin archives are signed with the Apple Developer ID, notarized,
#   re-uploaded, and checksums.txt rewritten to match;
# - the cask and formula get the signed checksums; the cask is audited
#   (brew audit --strict), installed from a staged copy of the tap and
#   checked (unbound-force and the uf alias), brew must load the formula,
#   and both are pushed to unbound-force/homebrew-tap.
#
# Fixes: https://github.com/unbound-force/unbound-force/issues/428

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.15.0)'
        required: true
        type: string
      skip_semver_check:
        description: 'Skip semver ordering verification'
        type: boolean
        default: false
      skip_ci_checks:
        description: 'Skip CI check verification on HEAD'
        type: boolean
        default: false
      skip_unreleased_check:
        description: 'Skip unreleased commits verification'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/go-release.yml@01e205c8897d54daac4d30b81710c695bfd1f31b # v0.10.0
    with:
      tag: ${{ inputs.tag }}
      allow_prerelease: true
      # Check names from ci_local.yml, ci_checks.yml, ci_security.yml
      ci_checks: '["Build and Test", "Standardized CI / Run linters", "OSV-Scanner / Trivy Source Scan", "Plugin Tests"]'
      skip_semver_check: ${{ inputs.skip_semver_check }}
      skip_ci_checks: ${{ inputs.skip_ci_checks }}
      skip_unreleased_check: ${{ inputs.skip_unreleased_check }}
      tap: unbound-force/homebrew-tap
      formula: unbound-force
      # The cask's binary and the uf alias its postflight_steps symlinks.
      cask_install_check: |
        test -x "$HOMEBREW_PREFIX/bin/unbound-force"
        test -L "$HOMEBREW_PREFIX/bin/uf"
        "$HOMEBREW_PREFIX/bin/uf" --version
    permissions:
      contents: write
      checks: read
      id-token: write
    # Mapped by name: `secrets: inherit` doesn't reach a workflow in
    # another owner's repo.
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
