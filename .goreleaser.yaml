# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

builds:
  - id: unbound-force
    main: ./cmd/unbound-force
    binary: unbound-force
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      unbound-force_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

release:
  prerelease: auto
  extra_files:
    - glob: dist/homebrew/Casks/unbound-force.rb
    - glob: dist/homebrew/Formula/unbound-force.rb
      name_template: unbound-force-formula.rb

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }} ({{ with .AuthorUsername }}@{{ . }}{{ else }}{{ .AuthorName }}{{ end }})"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: Security Updates
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 150
    - title: Bug Fixes
      regexp: '^.*?(fix|refactor)(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: Dependency Updates
      regexp: '^.*chore\(deps\):.*$'
      order: 250
    - title: Infrastructure Updates
      regexp: '^.*ci(\(.*\))?:.*$'
      order: 300
    - title: Documentation Updates
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 400
    - title: Other Work
      order: 9999
  filters:
    exclude:
      - '^chore:'
      - '^test:'
      - Merge pull request

nfpms:
  - id: unbound-force
    package_name: unbound-force
    vendor: Unbound Force
    homepage: "https://github.com/unbound-force/unbound-force"
    maintainer: "Unbound Force <team@unboundforce.dev>"
    description: "Unbound Force specification framework toolkit"
    license: Apache-2.0
    formats:
      - rpm
    bindir: /usr/bin
    contents:
      - src: /usr/bin/unbound-force
        dst: /usr/bin/uf
        type: symlink

brews:
  - name: unbound-force
    description: "Unbound Force specification framework toolkit"
    homepage: "https://github.com/unbound-force/unbound-force"
    directory: Formula
    # skip_upload: true: GoReleaser writes the formula to dist/ (uploaded as
    # unbound-force-formula.rb); jflowers/ship's go-release.yml sets its
    # darwin sha256s to the signed archives' and pushes it to the tap.
    skip_upload: true
    install: |
      bin.install "unbound-force"
      bin.install_symlink "unbound-force" => "uf"
    repository:
      owner: unbound-force
      name: homebrew-tap

homebrew_casks:
  - name: unbound-force
    description: "Unbound Force specification framework toolkit"
    homepage: "https://github.com/unbound-force/unbound-force"
    directory: Casks
    # skip_upload: true: GoReleaser writes the cask to dist/ (a release
    # asset); jflowers/ship's go-release.yml sets its darwin sha256s to the
    # signed archives', audits and install-checks it, and pushes it to the tap.
    skip_upload: true
    dependencies:
      - cask: dewey
    # custom_block, not hooks: GoReleaser renders hooks as a `postflight do`
    # block, which Homebrew deprecates; postflight_steps isn't in its DSL yet
    # (goreleaser/goreleaser#6873). The backticks keep GoReleaser from
    # templating Homebrew's {{staged_path}} and {{HOMEBREW_PREFIX}}. The uf
    # symlink is the daily-use alias (FR-002/FR-009).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
            args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/unbound-force"]
          symlink "unbound-force", "{{ `{{HOMEBREW_PREFIX}}` }}/bin/uf", overwrite: true
        end
      end
    repository:
      owner: unbound-force
      name: homebrew-tap
